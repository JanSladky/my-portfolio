name: transfer

on:
  workflow_dispatch: {}   # spustíš ručně v Actions

jobs:
  push_to_railway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: |
          npm ci
          npm i pg --save   # jistota pro Postgres

      - name: Run transfer to Railway
        env:
          STRAPI_TRANSFER_URL: ${{ secrets.STRAPI_TRANSFER_URL }}
          STRAPI_TRANSFER_TOKEN: ${{ secrets.STRAPI_TRANSFER_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: 0  # obejde SELF_SIGNED_CERT_IN_CHAIN
        run: |
          npx strapi transfer \
            --to "$STRAPI_TRANSFER_URL" \
            --to-token "$STRAPI_TRANSFER_TOKEN" \
            --force