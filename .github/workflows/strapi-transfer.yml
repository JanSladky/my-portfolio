name: transfer

on:
  workflow_dispatch: {}   # spustíš ručně v Actions

jobs:
  push_to_railway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend                  # <<< důležité
        run: |
          npm ci                                      # nainstaluje závislosti
          npm i pg --save                             # jistota pro Postgres

      - name: Run transfer to Railway
        working-directory: ./backend                  # <<< důležité
        env:
          STRAPI_TRANSFER_URL: ${{ secrets.STRAPI_TO_URL }}
          STRAPI_TRANSFER_TOKEN: ${{ secrets.STRAPI_TO_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: 0             # obejití “self‑signed cert”
        run: |
          npx strapi transfer \
            --to "$STRAPI_TRANSFER_URL" \
            --to-token "$STRAPI_TRANSFER_TOKEN" \
            --force