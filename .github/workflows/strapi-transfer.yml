name: transfer

on:
  workflow_dispatch: # spouštění ručně v GitHub UI

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Strapi CLI + pg
        run: |
          cd backend
          npm install pg --save
          npm install @strapi/strapi -g

      - name: Run transfer to Railway
        working-directory: ./backend   # <<< klíčová změna
        env:
          STRAPI_TRANSFER_URL: ${{ secrets.STRAPI_TO_URL }}
          STRAPI_TRANSFER_TOKEN: ${{ secrets.STRAPI_TO_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: 0   # obejití cert chyby
        run: |
          npx strapi transfer --to $STRAPI_TRANSFER_URL --to-token $STRAPI_TRANSFER_TOKEN --force