# .github/workflows/strapi-transfer.yml
name: Strapi Transfer (Local → Railway)

on:
  workflow_dispatch: {}

jobs:
  transfer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # <- důležité: běž v /backend

    env:
      # Strapi CLI očekává přesně tyto klíče:
      STRAPI_TRANSFER_URL: ${{ secrets.STRAPI_TO_URL }}
      STRAPI_TRANSFER_TOKEN: ${{ secrets.STRAPI_TO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install deps (backend)
        run: npm ci

      - name: Install Strapi CLI + pg
        run: |
          npm i -g @strapi/strapi
          npm i pg

      - name: Run transfer to Railway
        run: |
          npx strapi transfer \
            --to "$STRAPI_TRANSFER_URL" \
            --to-token "$STRAPI_TRANSFER_TOKEN" \
            --yes --force