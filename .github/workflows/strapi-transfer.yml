name: transfer

on:
  workflow_dispatch: {}    # spouštíš ručně v Actions

jobs:
  push_to_railway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: |
          npm ci
          npm i pg --save

      - name: Run transfer to Railway
        working-directory: ./backend
        env:
          # Strapi app keys (MUSÍ být stejné jako v tvém backend .env)
          APP_KEYS: ${{ secrets.APP_KEYS }}

          # Připojení na Railway Postgres (tajné hodnoty dej do GitHub Secrets)
          DATABASE_CLIENT: ${{ secrets.DATABASE_CLIENT }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          DATABASE_SSL_REJECT_UNAUTHORIZED: ${{ secrets.DATABASE_SSL_REJECT_UNAUTHORIZED }}

          # Cíl transferu (production Strapi)
          STRAPI_TRANSFER_URL: ${{ secrets.STRAPI_TRANSFER_URL }}
          STRAPI_TRANSFER_TOKEN: ${{ secrets.STRAPI_TRANSFER_TOKEN }}
        run: |
          npx strapi transfer \
            --to "$STRAPI_TRANSFER_URL" \
            --to-token "$STRAPI_TRANSFER_TOKEN" \
            --force